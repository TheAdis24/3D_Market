<!DOCTYPE html>
<html lang="cs">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J3H7J6L6W3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-J3H7J6L6W3');

    <meta charset="UTF-8">
    <title>Learning modely ke stažení | 3D Market</title>
    <meta name="description" content="Stahujte nejlepší learning modely. Filtrujte podle oblíbenosti, nejnovějších a nejstahovanějších kousků pro vaši 3D tiskárnu.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="hlavni-lista">
        <a href="index.html" class="logo-odkaz"><h1>3D Market</h1></a>
        <nav>
            <ul class="navigace-menu">
                <li><a href="Onas.html">O nás</a></li>
                <li><a href="Community.html">Community</a></li>
                <li><a href="Kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="filtry-box">
        <label for="radit">Seřadit podle:</label>
        <select name="radit" id="radit">
            <optgroup label="Popularita">
                <option value="nejstahovanejsi">Nejstahovanější</option>
                <option value="nejnavstevovanejsi">Nejvíce navštívené</option>
            </optgroup>
            <optgroup label="Čas nahrání">
                <option value="nejnovejsi">Nejnovější</option>
                <option value="nejstarsi">Nejstarší</option>
            </optgroup>
        </select>
    </section>

    <section class="modely-grid">

        <article class="model-karta">
            <img src="https://via.placeholder.com/250x150" alt="3D model držáku na sluchátka">
            <h2>Držák na sluchátka</h2>
            <p>Nahráno: Dnes | Staženo: 150x</p>
            <a href="#" class="hlavni-tlacitko">Stáhnout STL</a>
        </article>

        <article class="model-karta">
            <img src="https://via.placeholder.com/250x150" alt="3D model kalibrační lodička Benchy">
            <h2>Kalibrační lodička (Benchy)</h2>
            <p>Nahráno: Včera | Staženo: 890x</p>
            <a href="#" class="hlavni-tlacitko">Stáhnout STL</a>
        </article>

        <article class="model-karta">
            <img src="https://via.placeholder.com/250x150" alt="3D model kloubového draka">
            <h2>Kloubový drak (Articulated)</h2>
            <p>Nahráno: Před týdnem | Staženo: 3200x</p>
            <a href="#" class="hlavni-tlacitko">Stáhnout STL</a>
        </article>

    </section>
</main>
</body>
</html>
